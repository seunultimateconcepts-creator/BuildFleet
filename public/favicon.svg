<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="7" fill="#080D1A"/>
  <!-- Hexagon centered at 16,16 radius 13 -->
  <polygon points="16,3 27,9 27,23 16,29 5,23 5,9"
    fill="none" stroke="#F5A623" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Inner hex -->
  <polygon points="16,6 24,11 24,21 16,26 8,21 8,11"
    fill="#0D1525"/>
  <!-- Scan lines -->
  <line x1="9" y1="14" x2="23" y2="14" stroke="#F5A623" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <line x1="9" y1="16" x2="23" y2="16" stroke="#F5A623" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9" y1="18" x2="23" y2="18" stroke="#F5A623" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <!-- Tracker dot -->
  <circle cx="23" cy="16" r="2.5" fill="#F5A623"/>
  <circle cx="23" cy="16" r="4.5" fill="none" stroke="#F5A623" stroke-width="1" opacity="0.4"/>
  <!-- Center hub -->
  <circle cx="16" cy="16" r="4" fill="#1A2744"/>
  <circle cx="16" cy="16" r="1.8" fill="#F5A623"/>
</svg>
