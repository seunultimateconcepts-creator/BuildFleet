<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ED321"/>
      <stop offset="50%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00BFFF"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <circle cx="16" cy="16" r="15" fill="#0A0C14"/>

  <!-- 
    UTL arc: almost full circle, gap at BOTTOM RIGHT
    Start point: bottom-left (around 7 o'clock)
    End point: right side (around 4 o'clock)
    Arc goes CLOCKWISE upward — creates the U bowl shape
    
    Start: (5, 22) = bottom left
    End:   (27, 20) = right side  
    Large arc = 1, Sweep = 1 (clockwise)
  -->
  <path d="M5,22 A12,12 0 1,1 27,20"
    fill="none" stroke="url(#fg)" stroke-width="2" stroke-linecap="round"/>

  <!-- 
    Lines: start at BOTTOM (touching arc), end at TOP (dots)
    Going left-to-right, bottom-to-top diagonal
  -->
  <line x1="8"  y1="21" x2="11" y2="7"  stroke="url(#fg)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="12" y1="23" x2="15" y2="6"  stroke="url(#fg)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="20" y2="7"  stroke="url(#fg)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="20" y1="22" x2="25" y2="11" stroke="url(#fg)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Dots at TOP of each line -->
  <circle cx="11" cy="7"  r="1.8" fill="#7ED321"/>
  <circle cx="15" cy="6"  r="1.8" fill="#55D430"/>
  <circle cx="20" cy="7"  r="1.8" fill="#00C9A7"/>
  <circle cx="25" cy="11" r="2.2" fill="#00BFFF"/>
</svg>
